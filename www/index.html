   11b. FIRST RUN

   S.tutorial has been in the save schema since v1 and was never read or
   written, so a brand-new player met an unlabelled bar, five unlabelled rings
   and a pill reading "x1" with no explanation anywhere in the product. Three
   beats, taught by doing: name the request, name the delivery, name the cost of
   a miss. Uses the existing field, so the save format is unchanged.
   ========================================================================== */
var coach = { step: 0, on: false };

function coachDone(){ return !!S.tutorial; }

function coachStop(){
  coach.on = false; coach.step = 0;
  var c = $("#coach"); if(c) c.classList.remove("on");
  if(D) D.frozen = 0;
}

function coachShow(step){
  if(REDUCE && step === 0){ /* still run: this is instruction, not decoration */ }
  var c = $("#coach"), ring = $("#coachRing"), tip = $("#coachTip"), scrim = $("#coachScrim");
  if(!c || !D) return;

  var target = null, title = "", body = "", art = null;
  if(step === 0){
    var i0 = D.dogs.findIndex(function(d){ return d.state === "wait"; });
    if(i0 < 0) { coachStop(); return; }
    target = document.querySelector('.dog[data-i="'+i0+'"] .want');
    var d0 = D.dogs[i0], tb = tableFor(D.phase);
    art = tb[d0.want] ? ART[tb[d0.want].img] : null;
    title = d0.name + " wants " + (tb[d0.want] ? tb[d0.want].name.toLowerCase() : "something") + ".";
    body = "Every dog asks for one thing. It is written along the bottom of their card.";
  }else if(step === 1){
    var iw = D.dogs.findIndex(function(d){ return d.state === "wait"; });
    if(iw < 0){ coachStop(); return; }
    var want = D.dogs[iw].want;
    target = document.querySelector('#tray .item[data-k="'+want+'"]');
    title = "Tap it, then tap the dog.";
    body = "Or drag it straight across. Either works.";
  }else{
    target = $("#careWrap");
    title = "That one cost you.";
    body = "Every miss drains care. Empty it and the day is lost — but you keep everything you earned.";
  }
  if(!target){ coachStop(); return; }

  var b = target.getBoundingClientRect();
  var pad = 8;
  var x = b.left - pad, y = b.top - pad, w2 = b.width + pad*2, h2 = b.height + pad*2;
  ring.style.cssText = "left:"+x+"px;top:"+y+"px;width:"+w2+"px;height:"+h2+"px";
  // Cut the spotlight out of the scrim so the named thing is the only lit
  // thing on screen. evenodd on a polygon is the portable way to do a hole.
  scrim.style.clipPath = "polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 0," +
    " " + x + "px " + y + "px," +
    " " + x + "px " + (y+h2) + "px," +
    " " + (x+w2) + "px " + (y+h2) + "px," +
    " " + (x+w2) + "px " + y + "px," +
    " " + x + "px " + y + "px)";

  tip.innerHTML = "";
  tip.appendChild(el("div","coachStep","Step " + (step+1) + " of 3"));
  var head = el("div","cw");
  if(art){ var ai = el("img"); ai.src = art; ai.alt=""; head.appendChild(ai); }
  head.appendChild(el("div","ct", title));
  tip.appendChild(head);
  tip.appendChild(el("div","cd", body));

  // Place the tip on whichever side of the spotlight has room.
  var below = y + h2 + 14;
  var fits = below + 130 < window.innerHeight;
  tip.style.top = (fits ? below : Math.max(12, y - 140)) + "px";

  c.classList.add("on");
  coach.on = true; coach.step = step;
  D.frozen = 9999;                       // hold every clock while a beat is up
}

function coachMaybeStart(){
  if(coachDone() || S.day !== 1 || !D || D.phase !== "feed") return;
  setTimeout(function(){ if(D && !D.done && !overlayOpen) coachShow(0); }, 620);
}

/* Called from deliver(): the beats advance on the player doing the thing. */
function coachAdvance(kind){
  if(!coach.on && coachDone()) return;
  if(!coach.on) return;
  if(coach.step === 0 && kind === "select"){ coachShow(1); return; }
  if(coach.step === 1 && kind === "served"){
    coachStop();
    D.frozen = 0;
    return;
  }
  if(coach.step === 2 && kind === "any"){
    S.tutorial = 1; persist(); coachStop();
  }
}

function coachOnMiss(){
  if(coachDone() || S.day !== 1 || !D || D.done) return;
  if(coach.on) return;
  S.tutorial = 1; persist();            // only ever shown once
  coachShow(2);
  var c = $("#coachScrim");
  if(c) c.onclick = function(){ coachStop(); c.onclick = null; };
}

   12. RENDERING
   ========================================================================== */
function paintCurrency(){
  var c = fmt(S.coins), b = fmt(S.bones);
  ["#tCoins","#hCoins","#sCoins"].forEach(function(s){ var n=$(s); if(n) n.textContent = c; });
  ["#tBones","#sBones"].forEach(function(s){ var n=$(s); if(n) n.textContent = b; });
  regenHearts();
  var h = $("#tHearts"); if(h) h.textContent = S.hearts + "/" + HEART_MAX;
}

/* The timer colours used to be literal hex, so Meadow and Sunset kept a teal
   clock belonging to no theme and Night Shift kept a cream ring plate. Read
   them from the tokens instead, cached because paintRings runs every tick. */
var _tok = {}, _tokTheme = null;
function tok(name){
  if(_tokTheme !== S.theme){ _tok = {}; _tokTheme = S.theme; }
  if(!_tok[name]){
    var v = getComputedStyle(document.body).getPropertyValue(name);
    _tok[name] = (v || "").trim() || "#2f8f86";
  }
  return _tok[name];
}

function paintCare(){
  if(!D) return;
  var f = $("#careFill");
  f.style.transform = "scaleX(" + (clamp(D.care, 0, 100) / 100) + ")";
  f.className = D.care <= 25 ? "crit" : (D.care <= 55 ? "low" : "");
}

function paintClock(){
  if(!D) return;
  var w = $("#clockWrap"), r = $("#clockRing"), t = $("#clockTxt");
  var frac = clamp(D.clock / Math.max(1, D.clockMax), 0, 1);
  var C = 2 * Math.PI * 32;
  r.setAttribute("stroke-dasharray", C.toFixed(1));
  r.setAttribute("stroke-dashoffset", (C * (1 - frac)).toFixed(1));
  var col = D.frozen > 0 ? "#7fc4d8"
          : (frac > 0.5 ? tok("--ok") : (frac > 0.22 ? tok("--warnC") : tok("--critC")));
  r.setAttribute("stroke", col);
  t.textContent = Math.ceil(D.clock);
  w.className = D.frozen > 0 ? "" : (frac <= 0.22 ? "crit" : (frac <= 0.5 ? "warn" : ""));
}

function paintCombo(){
  if(!D) return;
  var p = $("#comboPill");
  p.textContent = "×" + D.mult.toFixed(2).replace(/\.?0+$/,"");
  var hot = D.combo >= 3;
  p.classList.toggle("hotPill", hot);
  var tr = $("#tray"); if(tr) tr.classList.toggle("hot", hot);
}

function paintRings(){
  if(!D || D.phase !== "feed") return;
  for(var i=0;i<D.dogs.length;i++){
    var d = D.dogs[i];
    var n = document.querySelector('.dog[data-i="'+i+'"] .pRing');
    if(!n) continue;
    var frac = d.state === "done" ? 1 : clamp(d.t / d.tmax, 0, 1);
    var C = 2 * Math.PI * 13;
    n.setAttribute("stroke-dasharray", C.toFixed(1));
    n.setAttribute("stroke-dashoffset", (C * (1 - frac)).toFixed(1));
    // One steady colour that only breaks to red near the end, so these read as
    // "how long this dog will wait" and never compete with the corner clock.
    n.setAttribute("stroke", frac > 0.2 ? tok("--ok") : tok("--critC"));
  }
}

function svgEl(cls, markup, colour){
  var n = el("div", cls);
  n.innerHTML = markup;
  var sv = n.firstChild;
  if(sv && sv.setAttribute){ sv.setAttribute("width","100%"); sv.setAttribute("height","100%"); sv.setAttribute("aria-hidden","true"); }
  if(colour) n.style.color = colour;
  return n;
}

function paintPlay(){
  if(!D) return;
  $("#dayChip").textContent = "Day " + S.day;
  $("#phaseName").textContent = phaseName(D.phase);
  $("#clockWrap").setAttribute("aria-label", phaseName(D.phase) + " timer");
  // Weather drives what the walk round asks for and nothing else, so it is
  // shown in the round where it is load-bearing rather than glued to every
  // phase label (which made a hot day read as an alarm at breakfast).
  var wp = $("#weatherPill");
  if(D.phase === "walk"){ wp.hidden = false; wp.textContent = D.weather.ic + " " + D.weather.name; }
  else wp.hidden = true;
  var order = ["feed","walk","bed"], at = order.indexOf(D.phase);
  var pips = $("#roundPips").children;
  for(var pi=0; pi<pips.length; pi++){
    pips[pi].className = pi < at ? "did" : (pi === at ? "now" : "");
  }
  $("#trayHint").textContent = phaseHint(D.phase);
  var bg = $("#fieldBg");
  var want = phaseBg(D.phase);
  if(bg.getAttribute("src") !== want) bg.src = want;

  paintCare(); paintClock(); paintCombo(); paintCurrency();

  var zone = $("#dogZone");
  zone.innerHTML = "";
  var wide = D.dogs.length >= 5;
  var tbl = tableFor(D.phase);
  D.dogs.forEach(function(d, i){
    var n = el("div","dog" + (wide ? " wide" : "") + (d.state === "done" ? " done" : ""));
    n.setAttribute("data-i", String(i));

    var por = el("img","por"); por.src = ART[d.img]; por.alt = d.name;
    n.appendChild(por);
    n.appendChild(el("div","nm", d.name));

    if(D.phase === "feed" && d.state === "wait"){
      var ring = el("div","ring");
      ring.innerHTML = '<svg width="31" height="31" viewBox="0 0 31 31">'
        + '<circle cx="15.5" cy="15.5" r="13" fill="none" stroke="var(--ringTrack)" stroke-width="4"></circle>'
        + '<circle class="pRing" cx="15.5" cy="15.5" r="13" fill="none" stroke="var(--ok)" stroke-width="4" stroke-linecap="round"></circle></svg>';
      n.appendChild(ring);
    }

    var badge = null;
    if(d.state === "hungry")       badge = el("div","badge","HUNGRY");
    else if(d.state === "tired")   badge = el("div","badge warn","TIRED");
    else if(d.state === "accident")badge = el("div","badge","OOPS");
    else if(d.state === "awake")   badge = el("div","badge warn","AWAKE");
    else if(D.phase !== "feed" && d.state !== "done" && !d.fed) badge = el("div","badge","HUNGRY");
    if(badge) n.appendChild(badge);

    if(d.state === "done")          n.appendChild(svgEl("stateIc", D.phase === "bed" ? MARK.sleep : MARK.heart, "var(--leaf)"));
    else if(d.state === "tired")    n.appendChild(svgEl("stateIc", MARK.tired, "var(--ball2)"));
    else if(d.state === "accident") n.appendChild(svgEl("stateIc", MARK.drop, "var(--sky)"));
    else if(d.state === "awake")    n.appendChild(svgEl("stateIc", MARK.awake, "var(--ball2)"));

    // The request, as the card's headline — full width, at the bottom, and
    // NAMED. As a 30px unlabelled thumbnail it was the smallest thing on screen
    // while carrying the entire decision, and "harness" versus "cool vest" at
    // that size is a coin flip. After delivery the same strip becomes the
    // receipt, so a served dog reads as resolved rather than as blank.
    var shown = d.state === "done" ? (d.got || d.want) : d.want;
    if(shown && tbl[shown]){
      var wb = el("div","want");
      var wi = el("img"); wi.src = ART[tbl[shown].img]; wi.alt = "";
      wb.appendChild(wi);
      wb.appendChild(el("div","wl", tbl[shown].name));
      if(d.state === "done") wb.appendChild(svgEl("tick", MARK.tick, "var(--leaf)"));
      n.appendChild(wb);
    }

    // Deliberately NO per-dog POINTER listener. All pointer delivery —
    // tap-then-tap and drag alike — goes through the single document-level
    // handler in trayInput, because two entry points meant a mouse/trackpad
    // release over a dog fired both and double-penalised every wrong item.
    // Keyboard is a separate path that pointer capture cannot reach.
    if(d.state === "wait"){
      n.setAttribute("role","button");
      n.setAttribute("tabindex","0");
      n.setAttribute("aria-label", d.name + " wants " + (tbl[d.want] ? tbl[d.want].name : ""));
      n.onkeydown = (function(idx){
        return function(ev){
          if(ev.key === "Enter" || ev.key === " "){
            ev.preventDefault();
            if(D && D.sel){ deliver(D.sel, idx); D.sel = null; paintTray(); }
          }
        };
      })(i);
    }
    zone.appendChild(n);
  });

  paintTray();
  paintBoosts();
  paintRings();
}

function paintTray(){
  if(!D) return;
  var tbl = tableFor(D.phase);
  var t = $("#tray"); t.innerHTML = "";
  D.tray.forEach(function(k){
    var def = tbl[k]; if(!def) return;
    var n = el("div","item" + (D.sel === k ? " sel" : ""));
    n.setAttribute("data-k", k);
    n.setAttribute("role","button");
    n.setAttribute("tabindex","0");
    n.setAttribute("aria-label", def.name);
    n.onkeydown = function(ev){
      if(ev.key === "Enter" || ev.key === " "){
        ev.preventDefault();
        D.sel = (D.sel === k) ? null : k;
        paintTray();
        if(coach.on) coachAdvance("select");
      }
    };
    var im = el("img"); im.src = ART[def.img]; im.alt = def.name;
    n.appendChild(im);
    n.appendChild(el("div","lbl", def.name));
    t.appendChild(n);
  });
}

function paintBoosts(){
  var r = $("#boostRail"); r.innerHTML = "";
  r.appendChild(el("div","rl","Boosts"));
  BOOST_ORDER.forEach(function(k){
    if(k === "heart") return;           // hearts are a menu action, not in-round
    var b = BOOSTS[k], ct = boostCt(k);
    var n = el("div","boostBtn" + (ct <= 0 ? " empty" : ""));
    n.setAttribute("role","button");
    n.setAttribute("tabindex","0");
    n.setAttribute("aria-label", b.name + ", " + ct + " left");
    if(ct <= 0) n.setAttribute("aria-disabled","true");
    var im = el("img"); im.src = ART[b.img]; im.alt = "";
    n.appendChild(im);
    n.appendChild(el("div","ct", String(ct)));
    n.onclick = function(){ useBoost(k); };
    n.onkeydown = function(ev){
      if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); useBoost(k); }
    };
    r.appendChild(n);
  });
}

/* ---- tray input: tap to select, or drag straight onto a dog --------------- */
(function trayInput(){
  var dragging = false, dragKey = null;
  var tray = null, ghost = null, gimg = null;

  function itemAt(target){
    var n = target;
    while(n && n !== document.body){
      if(n.classList && n.classList.contains("item")) return n;
      n = n.parentNode;
    }
    return null;
  }
  function dogIndexAt(x, y){
    var e = document.elementFromPoint(x, y);
    while(e && e !== document.body){
      if(e.classList && e.classList.contains("dog")) return Number(e.getAttribute("data-i"));
      e = e.parentNode;
    }
    return -1;
  }
  function highlight(i){
    var all = document.querySelectorAll(".dog");
    for(var j=0;j<all.length;j++) all[j].classList.toggle("target", j === i);
  }
  // One place to put the visual state back, so no exit path can strand the
  // ghost image on screen.
  function endDrag(){
    dragging = false;
    if(ghost) ghost.style.display = "none";
    highlight(-1);
  }

  document.addEventListener("pointerdown", function(ev){
    if(!D || overlayOpen) return;
    tray = tray || $("#tray");
    var it = itemAt(ev.target);
    if(!it || !tray.contains(it)) return;
    dragKey = it.getAttribute("data-k");
    dragging = true;
    D.sel = dragKey;
    paintTray();
    if(coach.on) coachAdvance("select");
    ghost = ghost || $("#ghost"); gimg = gimg || $("#ghostImg");
    var tbl = tableFor(D.phase);
    if(tbl[dragKey]){
      gimg.src = ART[tbl[dragKey].img];
      ghost.style.display = "block";
      ghost.style.left = ev.clientX + "px";
      ghost.style.top = ev.clientY + "px";
    }
  }, {passive:true});

  document.addEventListener("pointermove", function(ev){
    if(!dragging) return;
    ghost.style.left = ev.clientX + "px";
    ghost.style.top = ev.clientY + "px";
    highlight(dogIndexAt(ev.clientX, ev.clientY));
  }, {passive:true});

  // The single authority for delivery. Handles both interaction styles:
  //   drag  — pointerdown on a tray item, release over a dog
  //   tap   — tap a tray item to lift it, then tap a dog
  document.addEventListener("pointerup", function(ev){
    if(!D || overlayOpen){ endDrag(); return; }
    var i = dogIndexAt(ev.clientX, ev.clientY);

    if(dragging){
      endDrag();
      if(i >= 0){
        deliver(dragKey, i);
        D.sel = null;
        paintTray();
      }
      // Released anywhere else: the selection stays lifted so tap-then-tap works.
      dragKey = null;
      return;
    }

    // Not dragging — a plain tap on a dog spends whatever is currently lifted.
    if(i >= 0 && D.sel){
      deliver(D.sel, i);
      D.sel = null;
      paintTray();
    }
  }, {passive:true});

  // An incoming call, a notification-shade pull or the app switcher fires
  // pointercancel instead of pointerup. Without this the drag stayed armed and
  // the next innocent tap on a dog delivered the stale item.
  document.addEventListener("pointercancel", function(){
    endDrag();
    dragKey = null;
    if(D){ D.sel = null; paintTray(); }
  }, {passive:true});

  // Backgrounding the app mid-drag is the same situation by another route.
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){
      endDrag();
      dragKey = null;
      if(D){ D.sel = null; }
    }
  });
})();

/* ============================================================================
   13. SCREENS
   ========================================================================== */
function go(name){
  curScreen = name;
  ["titleScr","playScr","dexScr","shopScr"].forEach(function(id){
    document.getElementById(id).classList.remove("on");
  });
  if(name === "title"){ document.getElementById("titleScr").classList.add("on"); stopTimer(); paintCurrency(); }
  if(name === "play"){  document.getElementById("playScr").classList.add("on"); }
  if(name === "dex"){   document.getElementById("dexScr").classList.add("on"); paintDex(); }
  if(name === "shop"){  document.getElementById("shopScr").classList.add("on"); paintShop(); }
}

/* Any sheet opening pauses the loop; closing it grants a short grace period so
   the player is not immediately punished for the interruption. */
/* Focus used to walk the four title buttons BEHIND a dimmed, blurred sheet
   before it reached anything inside it, and Escape did nothing because the file
   had no key listener at all. */
var _focusBefore = null;

function overlay(sel, _unused){
  document.querySelectorAll(".sheet").forEach(function(n){ n.classList.remove("on"); });
  var sheet = document.querySelector(sel);
  sheet.classList.add("on");
  sheet.setAttribute("role","dialog");
  sheet.setAttribute("aria-modal","true");
  overlayOpen = true;

  // Everything behind the sheet stops being reachable while it is up.
  var app = $("#app");
  for(var i=0;i<app.children.length;i++){
    var c = app.children[i];
    if(!c.classList.contains("sheet") && c.id !== "toast") {
      try{ c.inert = true; }catch(e){}
      c.setAttribute("aria-hidden","true");
    }
  }
  if(document.activeElement && document.activeElement !== document.body) _focusBefore = document.activeElement;
  var box = sheet.firstElementChild || sheet;
  box.setAttribute("tabindex","-1");
  setTimeout(function(){ try{ box.focus({preventScroll:true}); }catch(e){} }, 60);
}

function closeOverlay(){
  document.querySelectorAll(".sheet").forEach(function(n){
    n.classList.remove("on"); n.removeAttribute("aria-modal");
  });
  var app = $("#app");
  for(var i=0;i<app.children.length;i++){
    var c = app.children[i];
    try{ c.inert = false; }catch(e){}
    c.removeAttribute("aria-hidden");
  }
  overlayOpen = false;
  grace = 8;                            // ~0.8s before the clock resumes biting
  if(_focusBefore){
    try{ _focusBefore.focus({preventScroll:true}); }catch(e){}
    _focusBefore = null;
  }
}

/* Escape closes whatever is open, and doubles as the pause key in a round. */
document.addEventListener("keydown", function(ev){
  if(ev.key !== "Escape" && ev.key !== "Esc") return;
  if(coach.on){ coachStop(); S.tutorial = 1; persist(); return; }
  if(overlayOpen){ closeOverlay(); return; }
  if(curScreen === "play" && D && !D.done){ showPause(); return; }
  if(curScreen === "dex" || curScreen === "shop") go("title");
});

/* ---- Dogdex -------------------------------------------------------------- */
function paintDex(){
  var g = $("#dexGrid"); g.innerHTML = "";
  var seen = 0;
  BREEDS.forEach(function(b){
    var e = S.dex[b.k];
    var known = !!(e && e.seen);
    if(known) seen++;
    var c = el("div","dexCard" + (known ? "" : " locked"));
    if(!known) c.setAttribute("aria-label", "Not yet met. Arrives day " + b.day);
    var im = el("img");
    // 34 portraits at full size decoded simultaneously is real memory pressure
    // in a WebView; let the browser defer everything below the fold.
    im.loading = "lazy"; im.decoding = "async";
    im.src = ART[b.img]; im.alt = known ? b.name : "Not yet met";
    c.appendChild(im);
    c.style.setProperty("--rc", known ? RARITY[b.rar].cl : "transparent");
    c.appendChild(el("div","nm", known ? b.name : "???"));
    if(known){
      c.appendChild(el("div","rr", RARITY[b.rar].n));
      var maxed = e.lv >= 5;
      c.appendChild(el("div","lv", maxed ? "Level 5 · Max" : "Level " + e.lv));
      var bar = el("div","lvBar" + (maxed ? " max" : "")); var fill = el("i");
      var need = e.lv * 8;
      // At level 5 the bar used to keep filling and resetting forever with
      // nothing left to earn.
      fill.style.setProperty("--p", maxed ? 1
        : Math.min(1, Math.round((e.served % need) / need * 100) / 100));
      bar.appendChild(fill); c.appendChild(bar);
      c.setAttribute("role","button"); c.setAttribute("tabindex","0");
      c.onclick = function(){ showDexCard(b, e); };
      c.onkeydown = function(ev){
        if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); showDexCard(b, e); }
      };
    }else{
      c.appendChild(el("div","lv", "Arrives day " + b.day));
    }
    g.appendChild(c);
  });
  $("#dexCount").textContent = seen + " / " + BREEDS.length;
}
function showDexCard(b, e){
  var box = $("#rewardBox"); box.innerHTML = "";
  var wrap = el("div","sceneWrap");
  var im = el("img","por"); im.src = ART[b.img]; im.alt = b.name;
  wrap.appendChild(im);
  wrap.appendChild(el("h2","h2", b.name));
  var t = el("div","tag", RARITY[b.rar].n); t.style.color = RARITY[b.rar].cl;
  wrap.appendChild(t);
  wrap.appendChild(el("div","sub", b.breed));
  var stats = el("div"); stats.style.width = "100%"; stats.style.margin = "6px 0";
  addStat(stats, "Level", String(e.lv) + " / 5");
  addStat(stats, "Times cared for", String(e.served));
  addStat(stats, "Favourite", FOODS[b.fav] ? FOODS[b.fav].name : b.fav);
  addStat(stats, "Size", b.size === "l" ? "Large" : b.size === "m" ? "Medium" : "Small");
  wrap.appendChild(stats);
  var q = el("div","speech"); q.textContent = b.fact; wrap.appendChild(q);
  var btn = el("button","btn gold wide","Close");
  btn.onclick = closeOverlay;
  wrap.appendChild(btn);
  box.appendChild(wrap);
  overlay("#rewardScr");
}

/* ---- Shop ---------------------------------------------------------------- */
var shopTab = "U";
function paintShop(){
  // Hiding the Bones tab outright is the part that matters. A tab that opens
  // onto "store unavailable" reads to a reviewer as a broken feature and
  // contradicts a listing that declares no purchases.
  var storeOn = IAP.available();
  $("#tabP").style.display = storeOn ? "" : "none";
  if(!storeOn && shopTab === "P") shopTab = "U";
  ["U","B","L","P"].forEach(function(t){
    var n = $("#tab"+t);
    n.classList.toggle("on", shopTab === t);
    n.setAttribute("aria-selected", shopTab === t ? "true" : "false");
  });

  var list = $("#shopList"); list.innerHTML = "";
  paintCurrency();
  if(shopTab === "U") paintUpgrades(list);
  else if(shopTab === "B") paintBoostShop(list);
  else if(shopTab === "L") paintThemeShop(list);
  else paintStore(list);
}

/* A price button that says which currency it wants. "1551" could have been
   either, and the bone rows used an emoji 40px from the real bone art. */
function priceBtn(kind, label, onBuy, disabled){
  var b = el("button","priceBtn" + (kind === "bone" ? " bone" : (kind === "flat" ? " owned" : "")));
  if(kind === "coin" || kind === "bone"){
    var im = el("img"); im.src = kind === "bone" ? ART.boneIcon : ART.coinIcon; im.alt = "";
    b.appendChild(im);
  }
  b.appendChild(el("span", null, label));
  if(disabled) b.setAttribute("disabled","");
  b.onclick = onBuy;
  return b;
}

/* `art` may be an ART key or a ready-made node (a theme swatch). */
function shopRow(art, title, desc, buttons, extra, note){
  var r = el("div","shopRow");
  if(typeof art === "string"){
    var im = el("img"); im.src = ART[art]; im.alt = "";
    r.appendChild(im);
  }else if(art){
    r.appendChild(art);
  }
  var t = el("div","txt");
  t.appendChild(el("div","tt", title));
  t.appendChild(el("div","ds", desc));
  if(note) t.appendChild(el("div","have", note));
  if(extra) t.appendChild(extra);
  r.appendChild(t);
  var col = el("div","buyCol");
  (buttons || []).forEach(function(b){ if(b) col.appendChild(b); });
  r.appendChild(col);
  return r;
}

function paintUpgrades(list){
  UP_ORDER.forEach(function(k){
    var u = UPGRADES[k], lv = upLv(k), maxed = lv >= u.max, cost = upCost(k);
    var dots = el("div","lvDots");
    for(var i=0;i<u.max;i++) dots.appendChild(el("i", i < lv ? "on" : null));
    var btn = maxed
      ? priceBtn("flat", "Maxed", function(){}, true)
      : priceBtn("coin", fmt(cost), function(){
          if(upLv(k) >= u.max) return;
          var c = upCost(k);
          if(S.coins < c){ toast("Not enough coins yet.", "bad"); return; }
          addCoins(-c); S.up[k] = upLv(k) + 1; persist(); paintShop();
          toast(u.name + " is now level " + S.up[k] + ".", "good");
        }, S.coins < cost);
    list.appendChild(shopRow(u.img, u.name, u.ds, [btn], dots,
      maxed ? "Fully upgraded" : "Level " + lv + " of " + u.max));
  });
}

function paintBoostShop(list){
  // One row per product with both prices side by side. Every boost used to be
  // listed twice — a coin row and a bone row with the same icon, stacked — so
  // four products filled eight rows and "You have N" appeared on only one.
  BOOST_ORDER.forEach(function(k){
    var b = BOOSTS[k];
    var boneCost = Math.round(b.bone * 2.5);
    var btns = [];
    if(b.coin > 0){
      btns.push(priceBtn("coin", fmt(b.coin), function(){
        if(S.coins < b.coin){ toast("Not enough coins yet.", "bad"); return; }
        addCoins(-b.coin); S.boosts[k] = boostCt(k) + 1; persist(); paintShop();
        toast("One " + b.name + " added.", "good");
      }, S.coins < b.coin));
    }
    btns.push(priceBtn("bone", boneCost + " · ×3", function(){
      if(S.bones < boneCost){ toast("Not enough bones.", "bad"); return; }
      addBones(-boneCost); S.boosts[k] = boostCt(k) + 3; persist(); paintShop();
      toast("Three " + b.name + " added.", "good");
    }, S.bones < boneCost));
    list.appendChild(shopRow(b.img, b.name, b.ds, btns, null,
      "You have " + boostCt(k)));
  });
}

/* Themes are a coin sink that never touches gameplay balance — the safest
   possible place to park surplus currency. They are not boosts, so they no
   longer sit under Boosts, and each one shows its own colours instead of the
   same sunny house illustrating "Night Shift". */
function themeSwatch(k){
  var sw = el("div","swatch");
  var probe = document.createElement("div");
  probe.className = THEMES[k].cl || "";
  probe.style.cssText = "position:absolute;visibility:hidden;pointer-events:none";
  document.body.appendChild(probe);
  var cs = getComputedStyle(probe);
  ["--bg","--panel","--teal3"].forEach(function(v){
    var i = el("i");
    i.style.background = (cs.getPropertyValue(v) || "").trim() || "var(--raise)";
    sw.appendChild(i);
  });
  document.body.removeChild(probe);
  return sw;
}

function paintThemeShop(list){
  Object.keys(THEMES).forEach(function(k){
    var owned = S.themes.indexOf(k) >= 0;
    var worn = S.theme === k;
    var btn = owned
      ? priceBtn("flat", worn ? "Worn" : "Wear", function(){
          S.theme = k; applyTheme(); persist(); paintShop();
        }, worn)
      : priceBtn("coin", "1200", function(){
          if(S.coins < 1200){ toast("Not enough coins yet.", "bad"); return; }
          addCoins(-1200); S.themes.push(k); S.theme = k; applyTheme(); persist(); paintShop();
          toast(THEMES[k].name + " unlocked.", "good");
        }, S.coins < 1200);
    list.appendChild(shopRow(themeSwatch(k), THEMES[k].name,
      owned ? "Yours. Tap to wear it." : "A new look for the whole daycare.",
      [btn], null, worn ? "Currently worn" : null));
  });
}

function paintStore(list){
  if(!IAP.available()){
    list.appendChild(el("div","emptyNote","The bone store is not part of this version."));
    return;
  }
  if(!IAP.ready){
    list.appendChild(el("div","emptyNote","Loading the store…"));
    return;
  }
  STORE_ORDER.forEach(function(sku){
    var it = STORE_ITEMS[sku];
    var pkg = IAP.find(sku);
    if(!pkg) return;                                // never show what cannot be sold
    if(it.kind === "n" && has(sku)) {
      list.appendChild(shopRow(it.img, it.name, "Owned. Thank you.",
        [priceBtn("flat", "Owned", function(){}, true)]));
      return;
    }
    var extra = it.tag ? el("div","tag", it.tag) : null;
    if(extra) extra.style.marginTop = "6px";
    list.appendChild(shopRow(it.img, it.name, it.ds,
      [priceBtn("flat", IAP.priceOf(sku), function(){
        IAP.buy(sku).then(function(){
          toast("Thank you!", "good"); persist(); paintShop();
        }).catch(function(e){
          if(e && /cancel/i.test(String(e.message || e))) return;
          toast("That did not go through.", "bad");
        });
      }, false)], extra));
  });

  var restore = el("button","btn ghost wide","Restore Purchases");
  restore.setAttribute("data-restore","1");
  restore.style.marginTop = "6px";
  restore.onclick = function(){
    IAP.restorePurchases().then(function(ok){ toast(ok ? "Purchases restored." : "Nothing to restore."); paintShop(); });
  };
  list.appendChild(restore);
}

/* ---- Settings + pause ---------------------------------------------------- */
function showSettings(){
  var box = $("#setBox"); box.innerHTML = "";
  box.appendChild(el("h2","h2","Settings"));

  var sound = el("button","btn ghost wide");
  sound.style.cssText = "margin-top:14px;justify-content:space-between";
  var sl = el("div","row"); sl.style.gap = "9px";
  sl.appendChild(svgEl("ic", S.sound ? ICONS.sound : ICONS.mute));
  sl.appendChild(el("span",null,"Sound & haptics"));
  sound.appendChild(sl);
  var sw = el("span", null, S.sound ? "On" : "Off");
  sw.style.cssText = "font-weight:800;color:" + (S.sound ? "var(--teal3)" : "var(--ink2)");
  sound.appendChild(sw);
  sound.onclick = function(){ S.sound = S.sound ? 0 : 1; persist(); showSettings(); };
  box.appendChild(sound);

  if(S.themes.length > 1){
    var th = el("button","btn ghost wide","Theme: " + THEMES[S.theme].name);
    th.style.marginTop = "8px";
    th.onclick = function(){
      var i = S.themes.indexOf(S.theme);
      S.theme = S.themes[(i+1) % S.themes.length];
      applyTheme(); persist(); showSettings();
    };
    box.appendChild(th);
  }

  var stats = el("div"); stats.style.margin = "14px 0";
  addStat(stats, "Best day", String(S.best));
  addStat(stats, "Dogs cared for", fmt(S.totalServed));
  addStat(stats, "Walks completed", fmt(S.totalWalks));
  addStat(stats, "Perfect days", String(S.perfectDays));
  addStat(stats, "Breeds met", dexSeen() + " / " + BREEDS.length);
  box.appendChild(stats);

  if(IAP.available()){
    var rp = el("button","btn ghost wide","Restore Purchases");
    rp.setAttribute("data-restore","1");
    rp.onclick = function(){ IAP.restorePurchases().then(function(ok){ toast(ok ? "Purchases restored." : "Nothing to restore."); }); };
    box.appendChild(rp);
  }

  var ach = el("div"); ach.style.marginTop = "16px";
  ach.appendChild(el("h2","h2","Achievements"));
  // Was a space-between pair of spans, so a two-word name wrapped and overlapped
  // its own right-aligned description. Two lines, and it shows progress now —
  // "Serve five hundred dogs" with no count told you nothing.
  ACHIEVEMENTS.forEach(function(a){
    var got = !!S.achv[a.k];
    var r = el("div","achRow" + (got ? " got" : ""));
    r.appendChild(svgEl("ai", got ? MARK.star : MARK.lock));
    var t = el("div","at");
    t.appendChild(el("div","an", a.n));
    t.appendChild(el("div","ad", a.d));
    if(!got && a.at){
      var now = a.at(), need = a.need;
      t.appendChild(el("div","ap", fmt(Math.min(now, need)) + " / " + fmt(need)));
    }
    r.appendChild(t);
    var v = el("div","an", got ? "Done" : ("+" + a.bones));
    v.style.cssText = "flex:0 0 auto;color:" + (got ? "var(--leaf)" : "var(--ink2)") + ";font-size:13.5px";
    r.appendChild(v);
    ach.appendChild(r);
  });
  box.appendChild(ach);

  var reset = el("button","btn ghost wide","Reset progress");
  reset.style.marginTop = "14px";
  reset.onclick = confirmReset;
  box.appendChild(reset);

  var close = el("button","btn gold wide","Close");
  close.style.marginTop = "8px";
  close.onclick = closeOverlay;
  box.appendChild(close);
  overlay("#setScr");
}

/* The privacy policy promises this control, so it has to exist and it has to
   actually clear the stored save rather than just resetting the in-memory copy
   — otherwise the next persist() writes the old progress straight back. */
function confirmReset(){
  // The safe option is the primary button, under the thumb; erasing is the
  // secondary one.
  showReward({
    img: ART.mopBucket,
    title: "Start over?",
    body: "This clears everything stored on this device: your day, your coins and bones, "
        + "the Dogdex, upgrades and achievements. It cannot be undone. Purchases are not "
        + "affected and can be restored.",
    btn: "Keep my progress",
    alt: "Erase everything",
    onAlt: function(){
      resetting = true;            // must be set before anything can persist()
      stopTimer();
      D = null;
      window.storage.set(SAVE_KEY, "").then(function(){
        try{ if(window.localStorage) window.localStorage.removeItem(SAVE_KEY); }catch(e){}
        location.reload();
      }).catch(function(){ resetting = false; });
    }
  }, null);
}

function showPause(){
  var box = $("#pauseBox"); box.innerHTML = "";
  box.appendChild(el("h2","h2","Paused"));
  box.appendChild(el("div","sub","Everyone is waiting patiently. The clock is stopped."));
  var r = el("button","btn gold wide","Back to it"); r.style.marginTop = "14px";
  r.onclick = closeOverlay; box.appendChild(r);
  var q = el("button","btn ghost wide","Give up the day"); q.style.marginTop = "8px";
  q.onclick = function(){ closeOverlay(); if(D && !D.done){ D.done = true; stopTimer(); } go("title"); };
  box.appendChild(q);
  overlay("#pauseScr");
}

function applyTheme(){
  document.body.className = THEMES[S.theme] ? THEMES[S.theme].cl : "";
  _tok = {}; _tokTheme = null;               // token cache is per-theme
  // The status bar was pinned to the default teal and did not follow a theme
  // the player had paid for.
  var m = document.querySelector('meta[name="theme-color"]');
  if(m){
    var c = (getComputedStyle(document.body).getPropertyValue("--panel") || "").trim();
    if(c) m.setAttribute("content", c);
  }
}

/* ---- daily streak / offline earnings ------------------------------------- */
function showWelcome(){
  var today = Math.floor(Date.now() / 86400000);
  var offlineCoins = 0;
  if(S.offlineAt){
    var mins = Math.min(8 * 60, (Date.now() - S.offlineAt) / 60000);
    // The idle trickle exists to make reopening the app feel like arriving
    // somewhere, not to replace playing. It is capped at eight hours.
    offlineCoins = Math.round(mins * (2 + upLv("yard") * 1.5) * coinMult());
  }
  var newStreak = (S.streakStamp === today) ? S.streak : (S.streakStamp === today - 1 ? S.streak : 0);
  if(!offlineCoins && !newStreak){ return false; }

  var box = $("#rewardBox"); box.innerHTML = "";
  var wrap = el("div","sceneWrap");
  var im = el("img","por"); im.src = ART.dutch_h; im.alt = "Dutch";
  wrap.appendChild(im);
  wrap.appendChild(el("h2","h2","Welcome back"));

  if(newStreak > 0){
    var row = el("div","streakRow");
    for(var i=1;i<=7;i++){
      var d = el("div","sDay" + (i <= (newStreak % 7 || 7) ? " got" : "") + (i === ((newStreak % 7) || 7) ? " today" : ""));
      d.appendChild(el("div",null,"D" + i));
      d.appendChild(el("div","v", String(i * 2)));
      row.appendChild(d);
    }
    wrap.appendChild(el("div","sub","Day streak: " + newStreak));
    wrap.appendChild(row);
  }
  if(offlineCoins > 0){
    addCoins(offlineCoins);
    wrap.appendChild(el("div","sub","The kennel kept ticking over while you were away: +" + fmt(offlineCoins) + " coins."));
  }
  var b = el("button","btn gold wide","Thanks, Dutch");
  b.onclick = closeOverlay;
  wrap.appendChild(b);
  box.appendChild(wrap);
  overlay("#rewardScr");
  return true;
}

/* ============================================================================
   14. BOOT
   ========================================================================== */
/* One icon set, one stroke weight. Replaces the emoji that were standing in for
   an icon system across the menu, the pills and the settings sheet. */
var ICONS = {
  paw:   '<svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="16.4" rx="5.5" ry="4.4"/><ellipse cx="5.4" cy="10.4" rx="2.5" ry="3.2"/><ellipse cx="9.9" cy="6.9" rx="2.4" ry="3.3"/><ellipse cx="14.9" cy="6.9" rx="2.4" ry="3.3"/><ellipse cx="19" cy="10.8" rx="2.4" ry="3.1"/></svg>',
  bag:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4.4 8h15.2l-1.3 11.2a1.8 1.8 0 0 1-1.8 1.6H7.5a1.8 1.8 0 0 1-1.8-1.6Z"/><path d="M8.6 8V6.4a3.4 3.4 0 0 1 6.8 0V8" stroke-linecap="round"/></svg>',
  cog:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5" stroke-linecap="round"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.4S3.6 15.3 3.6 9.5A4.7 4.7 0 0 1 12 6.7a4.7 4.7 0 0 1 8.4 2.8c0 5.8-8.4 10.9-8.4 10.9Z"/></svg>',
  sound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.4L12 5.4v13.2L7.4 14.5H4Z"/><path d="M15.8 9.4a3.7 3.7 0 0 1 0 5.2M18.4 6.8a7.4 7.4 0 0 1 0 10.4"/></svg>',
  mute:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.4L12 5.4v13.2L7.4 14.5H4Z"/><path d="m16.4 9.6 4.4 4.8M20.8 9.6l-4.4 4.8"/></svg>',
  swatch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.4" y="3.4" width="17.2" height="17.2" rx="3.4"/><path d="M3.4 14.6h17.2M9.6 3.4v17.2"/></svg>',
  back:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>'
};
function paintIcons(root){
  var ns = (root || document).querySelectorAll("[data-ic]");
  for(var i=0;i<ns.length;i++){
    var n = ns[i], k = n.getAttribute("data-ic");
    if(ICONS[k] && n.getAttribute("data-done") !== k){
      n.innerHTML = ICONS[k];
      n.setAttribute("data-done", k);
    }
  }
}

function paintStaticArt(){
  $("#titleBg").src = ART.bgHouse;
  $("#titleDutch").src = ART.dutchFull;
  paintIcons();
  ["#tCoinIc","#hCoinIc","#sCoinIc"].forEach(function(s){ var n=$(s); if(n) n.src = ART.coinIcon; });
  ["#tBoneIc","#sBoneIc"].forEach(function(s){ var n=$(s); if(n) n.src = ART.boneIcon; });
}

function wire(){
  $("#btnPlay").onclick = function(){ beginDay(); };
  $("#btnDex").onclick  = function(){ go("dex"); };
  $("#btnShop").onclick = function(){ go("shop"); };
  $("#btnSet").onclick  = function(){ showSettings(); };
  $("#dexBack").onclick = function(){ go("title"); };
  $("#shopBack").onclick= function(){ go("title"); };
  $("#btnPause").onclick= function(){ showPause(); };
  ["U","B","L","P"].forEach(function(t){
    var n = $("#tab" + t);
    n.onclick = function(){ shopTab = t; paintShop(); };
    n.onkeydown = function(ev){
      if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); shopTab = t; paintShop(); }
    };
  });

  // Leaving the app must both stop the clock and stamp the offline timer, or
  // the idle payout reads the wrong window and the loop keeps draining in the
  // background on Android.
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){
      S.offlineAt = Date.now(); persist();
      if(D && !D.done && curScreen === "play" && !overlayOpen) showPause();
    }
  });
  window.addEventListener("pagehide", function(){ S.offlineAt = Date.now(); persist(); });
}

function boot(){
  paintStaticArt();
  wire();
  load().then(function(){
    applyTheme();
    regenHearts();
    if(!S.dex[BREEDS[0].k]) S.dex[BREEDS[0].k] = {seen:1, served:0, lv:1};
    paintCurrency();
    return IAP.init();
  }).then(function(){
    paintCurrency();
    var shown = showWelcome();
    S.offlineAt = Date.now();
    persist();
    if(!shown) closeOverlay();
  }).catch(function(){
    paintCurrency();
  });
}

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

/* Exposed for scripts/playtest.js — the harness drives the same functions the
   player does rather than a parallel mock of them. */
window.S = S; window.D = D; window.ART = ART;
window.beginDay = beginDay; window.startPlay = startPlay; window.newDay = newDay;
window.deliver = deliver; window.enterPhase = enterPhase; window.afterPhase = afterPhase;
window.endDay = endDay; window.tick = tick; window.persist = persist;
window.useBoost = useBoost; window.buildTray = buildTray; window.dogCount = dogCount;
window.traySlots = traySlots; window.diff = diff; window.rosterFor = rosterFor;
</script>

# Codemagic CI for Preceptor: NCLEX (com.preceptor.nclex), branch claude/nclex.
# These workflows run from the existing Codemagic app "Preceptor: CCFP-EM"
# (same repository) with branch claude/nclex selected. Codemagic reads
# codemagic.yaml only from the repository root of the selected branch. The
# app lives in nclex-rn/, so every workflow sets working_directory to that
# folder, and artifact paths are relative to it.
#
# Signing uses the team code signing identities, not group variables:
#   Android: keystore reference preceptor_upload_key (alias preceptor)
#   iOS: certificate preceptor_distribution with the App Store profile for
#        com.preceptor.nclex, through environment.ios_signing
# Play uploads read GCLOUD_SERVICE_ACCOUNT_CREDENTIALS from group preceptor_play.
# App Store uploads use the integration preceptor_appstore.
#
# The root codemagic.yaml mirrors this file. Keep the two in step.
# tests/platform.test.ts checks them.
#
# nclex-android-release and nclex-ios-release publish to Play alpha (draft) and
# TestFlight. The two production workflows, nclex-android-production and
# nclex-ios-appstore, submit to Play production and App Store review. They run
# only when started by hand. Release notes come from nclex-rn/release_notes.json.

definitions:
  scripts:
    - &install
      name: Install JS dependencies
      script: npm ci --no-audit --no-fund
    - &test
      name: Unit tests and bank gates
      script: npm test
    - &launch_gate
      name: Launch gate. Full bank and real RevenueCat keys
      script: LAUNCH_GATE=1 npx vitest run tests/bank.test.ts tests/platform.test.ts
    - &build_web
      name: Build web bundle (Vite)
      script: npm run build

workflows:
  gitleaks-scan:
    name: Preceptor NCLEX (gitleaks secret scan — manual, full history)
    # Manual only, never on push, no store-publishing integration. The
    # compensating control for GitHub secret scanning / push protection /
    # branch protection, none of which this plan tier offers on a private
    # repo — see PRECEPTOR_APP_STANDARD.md §13A (dhoota/preceptor-mccqe).
    # Scans the whole repo's shared git history (covers CCFP-EM too).
    max_build_duration: 30
    instance_type: linux_x2
    triggering:
      events: []
    scripts:
      - name: Ensure full git history
        script: git fetch --unshallow 2>/dev/null || true
      - name: Install gitleaks
        script: |
          LATEST=$(curl -sS https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4)
          VER=${LATEST#v}
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/$LATEST/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
      - name: Full-history secret scan
        script: /tmp/gitleaks detect --source . -v

  nclex-android-debug:
    name: Preceptor NCLEX Android (debug APK)
    working_directory: nclex-rn
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
    scripts:
      - *install
      - *test
      - *build_web
      - name: Sync web assets into Android project
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  nclex-android-build-only:
    name: Preceptor NCLEX Android (build only, no Play upload)
    # Signed .aab and .apk as artifacts only, for the first manual upload to
    # Play. No Play credentials and no upload. versionCode comes from build.gradle.
    working_directory: nclex-rn
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
      android_signing:
        - preceptor_upload_key   # Code signing identities > Android keystores. Sets CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD.
    scripts:
      - name: Check the uploaded keystore
        # Fails in seconds if the keystore reference is missing, or its password,
        # alias or key password does not open it.
        script: bash scripts/ci/check-keystore.sh
      - *install
      - *test
      - *launch_gate
      - *build_web
      - name: Sync web assets into Android project
        script: npx cap sync android
      - name: Build signed release APK and AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab

  nclex-android-release:
    name: Preceptor NCLEX Android (signed release to Play alpha, draft)
    working_directory: nclex-rn
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
      android_signing:
        - preceptor_upload_key   # Code signing identities > Android keystores. Sets CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD.
      groups:
        - preceptor_play         # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS, the Play service account JSON key (Secure).
    scripts:
      - name: Fail fast if the Play credentials are missing
        script: |
          if [ -z "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" ]; then
            echo "Missing GCLOUD_SERVICE_ACCOUNT_CREDENTIALS. Add the Play service account JSON key to group preceptor_play in this Codemagic app (Environment variables), marked Secure."
            exit 1
          fi
      - name: Check the uploaded keystore
        # Fails in seconds if the keystore reference is missing, or its password,
        # alias or key password does not open it.
        script: bash scripts/ci/check-keystore.sh
      - *install
      - *test
      - *launch_gate
      - *build_web
      - name: Sync web assets into Android project
        script: npx cap sync android
      - name: Set versionCode one above the latest on Play
        script: |
          CURRENT=$(grep -oE 'versionCode [0-9]+' android/app/build.gradle | awk '{print $2}')
          LATEST=$(google-play get-latest-build-number \
            --package-name "com.preceptor.nclex" \
            --credentials "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" 2>/dev/null || true)
          if [ -n "$LATEST" ] && [ "$LATEST" -eq "$LATEST" ] 2>/dev/null && [ "$LATEST" -ge "$CURRENT" ]; then VC=$((LATEST + 1)); else VC="$CURRENT"; fi
          sed -i.bak "s/versionCode .*/versionCode $VC/" android/app/build.gradle && rm -f android/app/build.gradle.bak
          echo "versionCode $VC"
      - name: Build signed release APK and AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: alpha            # closed testing. Never production.
        submit_as_draft: true   # the app is still a draft on Play

  nclex-ios-release:
    name: Preceptor NCLEX iOS (TestFlight)
    working_directory: nclex-rn
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: preceptor_appstore
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        # Codemagic-managed signing. Uses the team distribution certificate
        # preceptor_distribution and the App Store profile for this bundle id,
        # both from Code signing identities.
        distribution_type: app_store
        bundle_identifier: com.preceptor.nclex
      vars:
        BUNDLE_ID: "com.preceptor.nclex"
    scripts:
      - *install
      - *test
      - *launch_gate
      - *build_web
      - name: Sync web assets into iOS project
        script: npx cap sync ios
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Set unique iOS build number
        script: cd ios/App && agvtool new-version -all "$BUILD_NUMBER"
      - name: Apply the App Store profile to the Xcode project
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  nclex-android-production:
    name: Preceptor NCLEX Android (Play production)
    working_directory: nclex-rn
    max_build_duration: 45
    environment:
      node: 20
      java: 21
      android_signing:
        - preceptor_upload_key
      groups:
        - preceptor_play
    scripts:
      - name: Fail fast if the Play credentials are missing
        script: |
          if [ -z "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" ]; then
            echo "Missing GCLOUD_SERVICE_ACCOUNT_CREDENTIALS in group preceptor_play."
            exit 1
          fi
      - name: Check the uploaded keystore
        script: bash scripts/ci/check-keystore.sh
      - *install
      - *test
      - *launch_gate
      - *build_web
      - name: Sync web assets into Android project
        script: npx cap sync android
      - name: Set versionCode one above the latest on Play
        script: |
          CURRENT=$(grep -oE 'versionCode [0-9]+' android/app/build.gradle | awk '{print $2}')
          LATEST=$(google-play get-latest-build-number \
            --package-name "com.preceptor.nclex" \
            --credentials "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" 2>/dev/null || true)
          if [ -n "$LATEST" ] && [ "$LATEST" -eq "$LATEST" ] 2>/dev/null && [ "$LATEST" -ge "$CURRENT" ]; then VC=$((LATEST + 1)); else VC="$CURRENT"; fi
          sed -i.bak "s/versionCode .*/versionCode $VC/" android/app/build.gradle && rm -f android/app/build.gradle.bak
          echo "versionCode $VC"
      - name: Build signed release AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      # Release notes come from release_notes.json in this folder.
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: false

  nclex-ios-appstore:
    name: Preceptor NCLEX iOS (App Store release)
    working_directory: nclex-rn
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: preceptor_appstore
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.preceptor.nclex
      vars:
        BUNDLE_ID: "com.preceptor.nclex"
        APP_STORE_APPLE_ID: "6816532704"
    scripts:
      - *install
      - *test
      - *launch_gate
      - *build_web
      - name: Sync web assets into iOS project
        script: npx cap sync ios
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Set the build number one above App Store Connect
        script: |
          LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          if [ -n "$LATEST" ] && [ "$LATEST" -eq "$LATEST" ] 2>/dev/null && [ "$LATEST" -ge "$BUILD_NUMBER" ]; then BN=$((LATEST + 1)); else BN="$BUILD_NUMBER"; fi
          echo "build number $BN"
          cd ios/App && agvtool new-version -all "$BN"
      - name: Apply the App Store profile to the Xcode project
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      # Release notes ("What's New") come from release_notes.json in this folder.
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
        # Removes a version waiting for review and submits this build instead.
        cancel_previous_submissions: true
        release_type: AFTER_APPROVAL

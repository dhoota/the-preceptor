<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Fully offline. No outbound connections from the web layer. RevenueCat runs in the native SDK. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:;" />
    <meta name="theme-color" content="#E8ECEF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1215" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Preceptor: NCLEX</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #E8ECEF; }
      @media (prefers-color-scheme: dark) { html, body, #root { background: #0F1215; } }
      body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

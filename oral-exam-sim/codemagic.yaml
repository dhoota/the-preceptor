# Codemagic CI for Preceptor: CCFP-EM (com.preceptor.oral).
# Mirrors the Preceptor CCFP pipeline. Shares its env groups and App Store
# Connect integration, so no new secrets are needed beyond what exists.
#
# Codemagic only reads codemagic.yaml from a repository root. The root of
# dhoota/the-preceptor holds a copy of this file with working_directory set
# to oral-exam-sim. Keep the two in step. See LAUNCH.md section 1.
#
# Nothing here publishes to production. iOS goes to TestFlight only. Android
# release goes to the Play closed testing track (alpha) as a draft, and the
# manual android-play-internal workflow goes to the internal track.

definitions:
  scripts:
    - &install
      name: Install JS dependencies
      script: npm ci --no-audit --no-fund
    - &test
      name: Unit tests and case validation
      script: npm test
    - &launch_gate
      name: Launch gate. Content minimums and real RevenueCat keys
      script: LAUNCH_GATE=1 npx vitest run tests/cases.test.ts tests/samps.test.ts tests/platform.test.ts
    - &build_web
      name: Build web bundle (Vite)
      script: npm run build

workflows:
  gitleaks-scan:
    name: Preceptor CCFP-EM (gitleaks secret scan — manual, full history)
    # Manual only, never on push, no store-publishing integration. The
    # compensating control for GitHub secret scanning / push protection /
    # branch protection, none of which this plan tier offers on a private
    # repo — see PRECEPTOR_APP_STANDARD.md §13A (dhoota/preceptor-mccqe).
    # Scans the whole repo's shared git history (covers NCLEX too).
    # This file mirrors ../codemagic.yaml — keep the two in step.
    max_build_duration: 30
    instance_type: linux_x2
    triggering:
      events: []
    scripts:
      - name: Ensure full git history
        script: git fetch --unshallow 2>/dev/null || true
      - name: Install gitleaks
        script: |
          LATEST=$(curl -sS https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4)
          VER=${LATEST#v}
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/$LATEST/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
      - name: Full-history secret scan
        script: /tmp/gitleaks detect --source . -v

  android-debug:
    name: Preceptor CCFP-EM Android (debug APK)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
    scripts:
      - *install
      - *test
      - *build_web
      - name: Sync web assets into Android project
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  android-release:
    name: Preceptor CCFP-EM Android (signed release)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
      android_signing:
        - preceptor_upload_key   # Code signing identities > Android keystores. Sets CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD.
      groups:
        - preceptor_play         # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS, the Play service account JSON key (Secure). Same setup as the other Preceptor apps.
    scripts:
      - name: Fail fast if the Play credentials are missing
        script: |
          if [ -z "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" ]; then
            echo "Missing GCLOUD_SERVICE_ACCOUNT_CREDENTIALS. Add the Play service account JSON key to group preceptor_play in this Codemagic app (Environment variables), marked Secure."
            exit 1
          fi
      - name: Check the uploaded keystore
        # Fails in seconds if the keystore reference is missing, or its password,
        # alias or key password does not open it.
        script: bash scripts/ci/check-keystore.sh
      - *install
      - *test
      - *launch_gate
      - *build_web
      - name: Sync web assets into Android project
        script: npx cap sync android
      - name: Set versionCode one above the latest on Play
        script: |
          CURRENT=$(grep -oE 'versionCode [0-9]+' android/app/build.gradle | awk '{print $2}')
          LATEST=$(google-play get-latest-build-number \
            --package-name "com.preceptor.oral" \
            --credentials "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" 2>/dev/null || true)
          if [ -n "$LATEST" ] && [ "$LATEST" -eq "$LATEST" ] 2>/dev/null && [ "$LATEST" -ge "$CURRENT" ]; then VC=$((LATEST + 1)); else VC="$CURRENT"; fi
          sed -i.bak "s/versionCode .*/versionCode $VC/" android/app/build.gradle && rm -f android/app/build.gradle.bak
          echo "versionCode $VC"
      - name: Build signed release APK and AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease
      - name: Publish to Google Play (alpha) with the R8 mapping file
        # Uploads the AAB to the alpha track (closed testing, a draft release,
        # never production), then its
        # deobfuscation file (mapping.txt) for the same versionCode so Play
        # Console can read crashes and ANRs. Codemagic's built-in Play
        # publishing uploads the bundle only, so this step replaces it.
        script: bash scripts/ci/play-publish.sh alpha --draft
    artifacts:
      - android/app/build/outputs/mapping/release/mapping.txt
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab

  android-build-only:
    name: Preceptor CCFP-EM Android (build only, no Play upload)
    # Same as android-release, but no Play credentials and no upload. Produces
    # the signed .aab and .apk as artifacts only, with the versionCode in build.gradle.
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
      android_signing:
        - preceptor_upload_key   # Code signing identities > Android keystores. Sets CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD.
    scripts:
      - name: Check the uploaded keystore
        # Fails in seconds if the keystore reference is missing, or its password,
        # alias or key password does not open it.
        script: bash scripts/ci/check-keystore.sh
      - *install
      - *test
      - *launch_gate
      - *build_web
      - name: Sync web assets into Android project
        script: npx cap sync android
      - name: Build signed release APK and AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab

  android-play-internal:
    name: Preceptor CCFP-EM Android (publish to Play internal track)
    max_build_duration: 30
    instance_type: mac_mini_m2
    # Manual trigger only. Never fires on push.
    environment:
      node: 20
      java: 21
      android_signing:
        - preceptor_upload_key
      groups:
        - preceptor_play      # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    scripts:
      - name: Fail fast if required secrets are missing
        script: |
          missing=""
          for v in GCLOUD_SERVICE_ACCOUNT_CREDENTIALS; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then echo "Missing:$missing"; exit 1; fi
      - name: Check the uploaded keystore
        # Fails in seconds if the keystore reference is missing, or its password,
        # alias or key password does not open it.
        script: bash scripts/ci/check-keystore.sh
      - *install
      - *test
      - *launch_gate
      - *build_web
      - name: Sync web assets into Android project
        script: npx cap sync android
      - name: Set versionCode one above the latest on Play
        script: |
          CURRENT=$(grep -oE 'versionCode [0-9]+' android/app/build.gradle | awk '{print $2}')
          LATEST=$(google-play get-latest-build-number \
            --package-name "com.preceptor.oral" \
            --credentials "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" 2>/dev/null || true)
          if [ -n "$LATEST" ] && [ "$LATEST" -eq "$LATEST" ] 2>/dev/null; then VC=$((LATEST + 1)); else VC="$CURRENT"; fi
          sed -i.bak "s/versionCode .*/versionCode $VC/" android/app/build.gradle && rm -f android/app/build.gradle.bak
          echo "versionCode $VC"
      - name: Build signed release AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease
      - name: Publish to Google Play (internal) with the R8 mapping file
        # Uploads the AAB to the internal track (internal testing track, as before), then its
        # deobfuscation file (mapping.txt) for the same versionCode so Play
        # Console can read crashes and ANRs. Codemagic's built-in Play
        # publishing uploads the bundle only, so this step replaces it.
        script: bash scripts/ci/play-publish.sh internal
    artifacts:
      - android/app/build/outputs/mapping/release/mapping.txt
      - android/app/build/outputs/**/*.aab

  ios-release:
    name: Preceptor CCFP-EM iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: preceptor_appstore
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        # Codemagic-managed signing. Uses the account-level distribution
        # certificate preceptor_distribution and the App Store profile for this
        # bundle id, both from Code signing identities. The keychain is set up
        # automatically, so no certificate key is restored here.
        distribution_type: app_store
        bundle_identifier: com.preceptor.oral
      vars:
        BUNDLE_ID: "com.preceptor.oral"
    scripts:
      - *install
      - *test
      - *launch_gate
      - *build_web
      - name: Sync web assets into iOS project
        script: npx cap sync ios
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Set unique iOS build number
        script: cd ios/App && agvtool new-version -all "$BUILD_NUMBER"
      - name: Apply the App Store profile to the Xcode project
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Production release. Starts only when a tag matching ccfpem-v* is pushed,
  # never on a branch push. Add release_notes.txt (What's New) from the second
  # release on. The first release, 1.0.1, has none.
  android-production:
    name: Preceptor CCFP-EM Android (production)
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ccfpem-v*'
          include: true
    environment:
      node: 20
      java: 21
      android_signing:
        - preceptor_upload_key
      groups:
        - preceptor_play
    scripts:
      - name: Fail fast if the Play credentials are missing (production)
        script: |
          if [ -z "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" ]; then
            echo "Missing GCLOUD_SERVICE_ACCOUNT_CREDENTIALS in group preceptor_play."
            exit 1
          fi
      - name: Check the uploaded keystore (production)
        script: bash scripts/ci/check-keystore.sh
      - *install
      - *test
      - *launch_gate
      - *build_web
      - name: Sync web assets into Android project (production)
        script: npx cap sync android
      - name: Set versionCode one above the latest on Play (production)
        script: |
          CURRENT=$(grep -oE 'versionCode [0-9]+' android/app/build.gradle | awk '{print $2}')
          LATEST=$(google-play get-latest-build-number \
            --package-name "com.preceptor.oral" \
            --credentials "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" 2>/dev/null || true)
          if [ -n "$LATEST" ] && [ "$LATEST" -eq "$LATEST" ] 2>/dev/null && [ "$LATEST" -ge "$CURRENT" ]; then VC=$((LATEST + 1)); else VC="$CURRENT"; fi
          sed -i.bak "s/versionCode .*/versionCode $VC/" android/app/build.gradle && rm -f android/app/build.gradle.bak
          echo "versionCode $VC"
      - name: Build signed release AAB (production)
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease
      - name: Publish to Google Play (production) with the R8 mapping file
        # Uploads the AAB to the production track (a draft release, sent to
        # production from Play Console), then its
        # deobfuscation file (mapping.txt) for the same versionCode so Play
        # Console can read crashes and ANRs. Codemagic's built-in Play
        # publishing uploads the bundle only, so this step replaces it.
        script: bash scripts/ci/play-publish.sh production --draft
    artifacts:
      - android/app/build/outputs/mapping/release/mapping.txt
      - android/app/build/outputs/**/*.aab

  ios-production:
    name: Preceptor CCFP-EM iOS (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ccfpem-v*'
          include: true
    integrations:
      app_store_connect: preceptor_appstore
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.preceptor.oral
      vars:
        BUNDLE_ID: "com.preceptor.oral"
    scripts:
      - *install
      - *test
      - *launch_gate
      - *build_web
      - name: Sync web assets into iOS project (production)
        script: npx cap sync ios
      - name: Install CocoaPods (production)
        script: cd ios/App && pod install
      - name: Set unique iOS build number (production)
        script: cd ios/App && agvtool new-version -all "$BUILD_NUMBER"
      - name: Apply the App Store profile to the Xcode project (production)
        script: xcode-project use-profiles
      - name: Build signed IPA (production)
        script: |
          xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: true
        cancel_previous_submissions: false   # never pull a version already in review
        release_type: AFTER_APPROVAL

  # App Store creative assets (App Asset Library): one 16:9 image for the
  # product page header and the search results. Manual only, never on a push.
  # Reviewed without a new app version; nothing here builds, versions or
  # touches a version's review. Reuses the existing preceptor_appstore
  # integration key. Recipe and what is verified: docs/ASSET-LIBRARY.md.
  # Run in order: asset-library (probe), asset-library-write, then
  # asset-library-place once the image is APPROVED.
  asset-library:
    name: Preceptor CCFP-EM creative assets - 1. probe (read only)
    max_build_duration: 20
    instance_type: linux_x2
    integrations:
      app_store_connect: preceptor_appstore
    environment:
      node: 22
      vars:
        APP_APPLE_ID: "6815475888"   # Preceptor: CCFP-EM
    triggering:
      events: []
    scripts: &asset_scripts
      - name: Confirm the asset is present and correctly shaped
        # A 16:9 image with an alpha channel is rejected on upload; check first.
        script: |
          f=store/asset-library/header-16x9.png
          [ -f "$f" ] || { echo "no asset at $f"; exit 1; }
          node -e '
            const fs=require("fs");const b=fs.readFileSync(process.argv[1]);
            if(b.readUInt32BE(0)!==0x89504e47){console.error("not a PNG");process.exit(1)}
            const w=b.readUInt32BE(16),h=b.readUInt32BE(20),depth=b[24],colour=b[25];
            console.log(`  ${w}x${h}, bit depth ${depth}, colour type ${colour}, ${b.length} bytes`);
            const bad=[];
            if(w!==5244||h!==2950) bad.push(`expected 5244x2950, got ${w}x${h}`);
            if(colour===6||colour===4) bad.push("has an alpha channel, which Apple rejects");
            if(bad.length){console.error("  "+bad.join("; "));process.exit(1)}
            console.log("  16:9, no transparency");
          ' "$f"
      - name: Normalise the App Store Connect API key
        script: sh tools/asc-key.sh && echo "APP_STORE_CONNECT_KEY_PATH=$CM_BUILD_DIR/asc_key.p8" >> "$CM_ENV"
      - name: Asset Library
        script: node tools/asset-library.mjs
    artifacts:
      - store/asset-library/*.png

  asset-library-write:
    name: Preceptor CCFP-EM creative assets - 2. upload and submit
    max_build_duration: 30
    instance_type: linux_x2
    integrations:
      app_store_connect: preceptor_appstore
    environment:
      node: 22
      vars:
        APP_APPLE_ID: "6815475888"
        ASSET_LIBRARY_WRITE: "1"
        ASSET_LIBRARY_CATEGORY: CREATIVE_ASSETS   # verified on HALO
    triggering:
      events: []
    scripts: *asset_scripts
    artifacts:
      - store/asset-library/*.png

  asset-library-place:
    name: Preceptor CCFP-EM creative assets - 3. place on every localization
    max_build_duration: 20
    instance_type: linux_x2
    integrations:
      app_store_connect: preceptor_appstore
    environment:
      node: 22
      vars:
        APP_APPLE_ID: "6815475888"
        ASSET_LIBRARY_PLACE: "1"
    triggering:
      events: []
    scripts: *asset_scripts

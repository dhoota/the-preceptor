apply plugin: 'com.android.application'

// ---- Release signing -------------------------------------------------------
// Local builds read app/keystore.properties. On Codemagic, the keystore comes
// from environment.android_signing (reference preceptor_upload_key), which sets
// CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS and CM_KEY_PASSWORD.
// With neither, release builds stay unsigned and debug builds still work.
def keystorePropsFile = file("keystore.properties")
def ksProps = new Properties()
if (keystorePropsFile.exists()) { ksProps.load(new FileInputStream(keystorePropsFile)) }
def ksStoreFile = keystorePropsFile.exists() ? ksProps['storeFile'] : System.getenv('CM_KEYSTORE_PATH')
def ksStorePass = keystorePropsFile.exists() ? ksProps['storePassword'] : System.getenv('CM_KEYSTORE_PASSWORD')
def ksKeyAlias  = keystorePropsFile.exists() ? ksProps['keyAlias'] : System.getenv('CM_KEY_ALIAS')
def ksKeyPass   = keystorePropsFile.exists() ? ksProps['keyPassword'] : System.getenv('CM_KEY_PASSWORD')
def canSignRelease = ksStoreFile != null && file(ksStoreFile).exists()

android {
    namespace "com.preceptor.oral"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.preceptor.oral"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.0.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile file(ksStoreFile)
                storePassword ksStorePass
                keyAlias ksKeyAlias
                keyPassword ksKeyPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// ---- Play Billing compliance guard -----------------------------------------
// Play reads com.google.android.play.billingclient.version from the merged
// manifest and rejects updates built with Billing < 8 (deadline Nov 1 2026).
// BillingClient arrives transitively (purchases-capacitor -> hybrid-common ->
// purchases-android -> com.android.billingclient:billing), so a plugin
// downgrade or a manifest-merge rule could silently drop below 8. Fail the
// release build instead of finding out from Play Console.
def minPlayBillingMajor = 8
afterEvaluate {
    tasks.matching { it.name ==~ /process.*ReleaseMainManifest/ }.configureEach { t ->
        t.doLast {
            def merged = t.outputs.files.asFileTree.matching { include '**/AndroidManifest.xml' }.files
            if (merged.isEmpty()) throw new GradleException("Play Billing guard: no merged AndroidManifest.xml from ${t.name}")
            merged.each { f ->
                def m = (f.text =~ /android:name="com\.google\.android\.play\.billingclient\.version"\s+android:value="([0-9.]+)"/)
                if (!m.find()) throw new GradleException("Play Billing guard: com.google.android.play.billingclient.version missing from ${f}")
                def v = m.group(1)
                if ((v.tokenize('.')[0] as int) < minPlayBillingMajor) {
                    throw new GradleException("Play Billing guard: merged manifest has BillingClient ${v}; Play requires >= ${minPlayBillingMajor}.0.0")
                }
                logger.lifecycle("Play Billing guard: BillingClient ${v} in merged manifest (${f.name})")
            }
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
